name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-api.txt pytest==9.1.1 httpx2==2.13.1

      - name: Run tests
        run: python -m pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t f1-pit-strategy .

      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 --name f1-api f1-pit-strategy
          sleep 5
          curl --fail http://127.0.0.1:8000/health